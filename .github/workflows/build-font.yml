name: Build TwinLine V2 font
on:
  push:
    paths:
      - 'build_font.py'
      - 'font_studio.py'
      - 'samples/**'
      - 'tests/**'
      - 'specimen/**'
      - '.github/workflows/build-font.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install font sources
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-lato fonts-noto-cjk fontconfig
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install builder
        run: python -m pip install fonttools
      - name: Check Python syntax
        run: python -m py_compile build_font.py font_studio.py
      - name: Test input validation and renderer
        run: |
          python -m unittest discover -s tests -v
          node tests/test_renderer.js
      - name: Build and validate
        run: python build_font.py
      - uses: actions/upload-artifact@v4
        with:
          name: TwinLine-V2-font
          path: |
            dist/*.ttf
            dist/*.mapping.json
            dist/*.txt
          if-no-files-found: error
