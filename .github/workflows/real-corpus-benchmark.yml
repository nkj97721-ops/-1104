name: Real corpus alignment benchmark

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - "docs/gold-alignment-format.md"
      - ".github/workflows/real-corpus-benchmark.yml"
      - "requirements-benchmark.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-corpus-alignment-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-benchmark.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-align-models-v1-${{ runner.os }}-py311
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-benchmark.txt
      - name: Run unit tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
      - name: Download English and Simplified Chinese corpus and build automatic silver references
        run: |
          python tools/prepare_opensubtitles2024_gold.py \
            --output-dir data/opensubtitles2024-silver \
            --max-lines-per-document 80
      - name: Prepare WMT news calibration and WMT17 held-out silver references
        run: |
          python tools/prepare_wmt_gold_queue.py \
            --output-dir data/wmt-silver \
            --calibration-documents 20 \
            --max-segments-per-document 40
      - name: Run dual-model automatic silver benchmark on OpenSubtitles
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python tools/benchmark_silver_groups.py \
            --input data/opensubtitles2024-silver/silver_reference.jsonl \
            --output reports/opensubtitles2024-silver-comparison.json \
            --thresholds 0.20,0.25,0.30,0.35,0.40 \
            --gap-penalties 0.04,0.08,0.12,0.16 \
            --merge-penalties 0.00,0.02,0.04,0.06,0.10,0.14,0.18,0.22 \
            --max-documents-per-split 40 \
            --no-cuda
      - name: Run dual-model automatic silver benchmark on WMT
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python tools/benchmark_silver_groups.py \
            --input data/wmt-silver/silver_reference.jsonl \
            --output reports/wmt17-silver-comparison.json \
            --thresholds 0.20,0.25,0.30,0.35,0.40 \
            --gap-penalties 0.04,0.08,0.12,0.16 \
            --merge-penalties 0.00,0.02,0.04,0.06,0.10,0.14,0.18,0.22 \
            --max-documents-per-split 60 \
            --no-cuda
      - name: Upload silver-reference corpus, manifests and model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: en-zh-automatic-silver-benchmark-${{ github.run_number }}
          path: |
            data/opensubtitles2024-silver/manifest.json
            data/opensubtitles2024-silver/silver_reference.jsonl
            data/wmt-silver/manifest.json
            data/wmt-silver/silver_reference.jsonl
            reports/opensubtitles2024-silver-comparison.json
            reports/wmt17-silver-comparison.json
          if-no-files-found: warn
          retention-days: 30
